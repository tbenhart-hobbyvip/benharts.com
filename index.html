<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Benhart Family History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#F2F4F7;--card:#FFFFFF;--ink:#1A2230;--muted:#5A6576;--line:#D3DAE3;--stamp:#55449E;--stamp-soft:#ECE8F8;--bad:#A63A3A}
@media (prefers-color-scheme:dark){:root{--paper:#11151B;--card:#1A2029;--ink:#E5E9EF;--muted:#9BA6B5;--line:#2C3542;--stamp:#AE9FF2;--stamp-soft:#2A2545;--bad:#E58A8A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1{font:600 26px/1.2 Spectral,Georgia,serif;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--stamp);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
button{width:100%;font:600 15px/1 inherit;font-family:inherit;padding:12px;border:0;border-radius:8px;background:var(--stamp);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#11151B}}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:21px;margin:10px 0 0}
</style></head>
<body>
<form id="f" autocomplete="on">
  <h1>Benhart Family History</h1>
  <p>Private family site. Enter the family password.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <div class="row"><input id="rem" type="checkbox" checked><label for="rem" style="margin:0">Remember on this device</label></div>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>

    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveBits"]);
    const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256));
    await open(raw, document.getElementById("rem").checked);
  } catch (x) {
    err.textContent = "That password didn't work."; go.disabled = false; go.textContent = "Open";
  }
});
</script>
